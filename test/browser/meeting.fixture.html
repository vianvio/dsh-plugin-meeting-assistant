<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会议助手交互验证</title><style>:root{--dsw-alias-bg-base:#fff;--dsw-alias-label-primary:#242424;--dsw-alias-border-l3:#ddd;font-family:system-ui,-apple-system,sans-serif;color:#242424;background:#f7f7f8}*{box-sizing:border-box}body{margin:0}main{display:flex;height:100vh}.conversation{flex:1;min-width:0;display:flex;flex-direction:column}.empty-chat{margin:auto;display:grid;gap:12px;text-align:center;font-size:23px;font-weight:600;line-height:1.5}.empty-chat small{font-size:12px;font-weight:400;opacity:.5}footer{margin:24px;padding:14px 18px;border:1px solid #ddd;border-radius:16px;background:var(--dsw-alias-bg-base)}#preview-panel{width:420px;max-width:100vw;min-width:320px;background:var(--dsw-alias-bg-base);border-left:1px solid #ddd}button:disabled{opacity:.45;cursor:default!important}button:focus-visible,summary:focus-visible{outline:2px solid #2769e7;outline-offset:3px}summary::marker{font-size:10px}@media(prefers-color-scheme:dark){:root{--dsw-alias-bg-base:#29292b;--dsw-alias-label-primary:#eee;--dsw-alias-border-l3:#48484a;color:#eee;background:#222}footer,#preview-panel{border-color:#454548}select option{background:#29292b}}@media(max-width:650px){.empty-chat{font-size:14px}.empty-chat small{display:none}footer{margin:6px;padding:8px}}</style><div id="root"></div><script type="module" src="/app.js"></script></html>
